<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            KNOWME Studio | Website Design & Development
        {% endblock %}
    </title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KNOWME Studio">
    <meta property="og:description" content="Modern, fast and secure websites for businesses and professionals.">
    <meta property="og:image" content="{{ url_for('static', filename='images/knowme-preview.png', _external=True) }}">
    <meta property="og:url" content="{{ request.base_url }}">

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KNOWME Studio">
    <meta name="twitter:description" content="Modern, fast and secure websites for businesses and professionals.">
    <meta name="twitter:image" content="{{ url_for('static', filename='images/knowme-preview.png', _external=True) }}">

    <!-- SEO -->
    <meta name="description" content="{% block meta_description %}KNOWME Studio creates modern, responsive websites and web applications, from design and backend development to security and deployment.{% endblock %}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ 'https://knowme-studio.onrender.com' ~ request.path }}">

    <!-- GOOGLE SEARCH CONSOLE -->
    <meta name="google-site-verification" content="Voyjjo8DSZPgJapl1liKaANEWE0qVwuQCyweJdMqpX8">
    <meta name="msvalidate.01" content="73AAB2FC3167EE5D78D6D3D5877A9236">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
<header class="topbar">
    <!-- LOGO -->
    <a href="{{ url_for('landing') }}" class="logo">
        <span class="logo-k">K</span>NOWME Studio
    </a>

    <!-- MAIN NAVIGATION -->
    <nav class="main-nav">
        <a href="{{ url_for('why_knowme') }}" class="nav-btn" data-i18n="nav.why">Why KNOWME?</a>
        <a href="{{ url_for('home') }}" class="nav-btn" data-i18n="nav.home">Home</a>
        <a href="{{ url_for('prices') }}" class="nav-btn" data-i18n="nav.prices">Prices</a>
        <a href="{{ url_for('projects') }}" class="nav-btn" data-i18n="nav.projects">Projects</a>
        <a href="{{ url_for('contact') }}" class="nav-btn" data-i18n="nav.contact">Contact</a>
        <a href="{{ url_for('start_project') }}" class="nav-btn nav-btn-project" data-i18n="nav.startProject" aria-label="Start a project">Start Project</a>
    </nav>

    <!-- LANGUAGES -->
    <div class="language-switcher">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="hy">HY</button>
    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
